<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Ledger · money habits coach</title>
<meta name="description" content="Upload a bank statement you already have and see where your money goes. Ledger reads it on your phone, finds your habits and coaches you to better ones.">
<meta name="theme-color" content="#08784A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Ledger · money habits coach">
<meta property="og:description" content="Upload a bank statement you already have and see where your money goes. Ledger reads it on your phone, finds your habits and coaches you to better ones.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Statements"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <main id="view" tabindex="-1"></main>
    <p class="foot">Ledger gives financial education based on your own data. It is not licensed investment, tax or legal advice, and it never connects to your bank.</p>
  </div>
</div>
<div id="sheetRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="fileIn" accept=".pdf,.csv,.txt,.xlsx,.xls" hidden>
<noscript><p style="padding:16px">Ledger needs JavaScript to read your statement on your device.</p></noscript>
<script src="app.js"></script>
</body>
</html>
