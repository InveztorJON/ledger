# Runs requests sent to the Ledger Telegram bot (netlify/functions/telegram.mjs starts it with a repository_dispatch).
#   telegram-edit: Claude changes the site on the telegram/changes branch, runs the tests, opens or updates a pull request
#                  and sends the preview to Telegram. Nothing goes live until the owner taps Publish.
#   telegram-post: Claude drafts posts for X, LinkedIn, TikTok and YouTube and sends them to Telegram.
# Repository secrets: TELEGRAM_BOT_TOKEN, and CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max, no extra cost) or ANTHROPIC_API_KEY (paid per use).
name: Telegram requests

on:
  repository_dispatch:
    types: [telegram-edit, telegram-post]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telegram-${{ github.event.action }}
  cancel-in-progress: false

env:
  REQUEST: ${{ github.event.client_payload.text }}
  CONTEXT: ${{ github.event.client_payload.context }}
  CHAT_ID: ${{ github.event.client_payload.chat_id }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  BRANCH: telegram/changes
  RESULT_FILE: ${{ github.workspace }}/../claude.json

jobs:
  edit:
    if: github.event.action == 'telegram-edit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Continue the waiting change, or start a new one from main
        id: base
        run: |
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          echo "existing=$PR" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude makes the change
        run: |
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          {
            cat .github/telegram/edit-prompt.md
            printf '\n\n'
            if [ -n "$CONTEXT" ]; then printf 'The owner is replying to this earlier message from you:\n%s\n\n' "$CONTEXT"; fi
            printf 'Request from the owner:\n%s\n' "$REQUEST"
          } | claude -p --permission-mode acceptEdits --max-turns 60 --output-format json \
                --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test),Bash(npm test:*),Bash(python3 tools/make_viewer.py)" \
                > "$RESULT_FILE" || true

      - name: Keep the bot's own files out of the change
        run: |
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq -- .github

      - name: Run the tests
        id: tests
        run: |
          if npm test > ../test.log 2>&1; then echo "result=pass" >> "$GITHUB_OUTPUT"; else echo "result=fail" >> "$GITHUB_OUTPUT"; tail -40 ../test.log; fi

      - name: Save the change and open or update the pull request
        id: pr
        env:
          EXISTING: ${{ steps.base.outputs.existing }}
          TESTS: ${{ steps.tests.outputs.result }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          TITLE="$(printf '%s' "$REQUEST" | tr '\r\n' '  ')"; TITLE="${TITLE:0:60}"
          git -c user.name="Ledger Telegram bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Telegram: $TITLE"
          if [ -n "$EXISTING" ]; then git push -q origin "$BRANCH"; else git push -q --force origin "$BRANCH"; fi
          {
            echo "Requested from the Ledger Telegram bot. Publish or discard it from Telegram."
            echo
            echo "**Latest request:** $TITLE"
            echo
            jq -r '.result // ""' "$RESULT_FILE" 2>/dev/null | head -c 3000
            echo
            echo
            if [ "$TESTS" = "pass" ]; then echo "Tests: passed"; echo '<!-- tests: pass -->'; else echo "Tests: **failed**"; fi
          } > ../body.md
          if [ -n "$EXISTING" ]; then
            gh pr edit "$BRANCH" --body-file ../body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Telegram: $TITLE" --body-file ../body.md
          fi
          gh pr view "$BRANCH" --json number,url --jq '"number=\(.number)\nurl=\(.url)"' >> "$GITHUB_OUTPUT"
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"; git diff --name-only origin/main...HEAD >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Tell the owner in Telegram
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          TESTS: ${{ steps.tests.outputs.result }}
          CHANGED: ${{ steps.pr.outputs.changed }}
        run: node tools/telegram_report.mjs edit

      - name: Tell the owner something went wrong
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/telegram_report.mjs error

  post:
    if: github.event.action == 'telegram-post'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude drafts the posts
        run: |
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          { cat .github/telegram/post-prompt.md; printf '\n\nWhat to post about:\n%s\n' "$REQUEST"; } \
            | claude -p --max-turns 8 --output-format json --allowedTools "Read,Glob,Grep" > "$RESULT_FILE" || true

      - name: Send the drafts to Telegram
        run: node tools/telegram_report.mjs post

      - name: Tell the owner something went wrong
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/telegram_report.mjs error
