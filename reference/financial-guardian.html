<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: statements column (sticky, left) beside the main view on wide screens; bottom tab bar on phones */
:root{
  --bg:#EDF1EE; --surface:#FBFCFB; --surface-2:#E2E9E4; --line:#D0DAD3;
  --ink:#0F2219; --ink-2:#4B5E54; --ink-3:#5C6E64;
  --green:#06703F; --green-ink:#F4FBF7; --green-soft:#D3ECDD;
  --blue:#23608C; --blue-soft:#D6E6F2;
  --gold:#C08010; --gold-ink:#7E5300; --gold-soft:#F5E5C2;
  --coral:#A8341F; --coral-ink:#FFFFFF; --coral-soft:#F8E1DA;
  --scrim:rgba(6,18,12,.5);
  --shadow:0 1px 2px rgba(15,34,25,.05),0 8px 24px rgba(15,34,25,.07);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1511; --surface:#111E18; --surface-2:#1A2A22; --line:#25392F;
    --ink:#E3EDE7; --ink-2:#A6BAAE; --ink-3:#83998C;
    --green:#3BC98C; --green-ink:#04130C; --green-soft:#143A28;
    --blue:#74B6E8; --blue-soft:#132C40;
    --gold:#EBB140; --gold-ink:#F2C96F; --gold-soft:#382C10;
    --coral:#FF8468; --coral-ink:#1B0703; --coral-soft:#3F1C14;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1511; --surface:#111E18; --surface-2:#1A2A22; --line:#25392F;
  --ink:#E3EDE7; --ink-2:#A6BAAE; --ink-3:#83998C;
  --green:#3BC98C; --green-ink:#04130C; --green-soft:#143A28;
  --blue:#74B6E8; --blue-soft:#132C40;
  --gold:#EBB140; --gold-ink:#F2C96F; --gold-soft:#382C10;
  --coral:#FF8468; --coral-ink:#1B0703; --coral-soft:#3F1C14;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.num,.stat b,.bar-row,.tx .amt{font-variant-numeric:tabular-nums}
button{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--green);text-underline-offset:2px}

.app{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:14px 108px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:980px){
  .app{grid-template-columns:340px minmax(0,1fr);gap:24px;padding-block:24px 40px}
  .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin}
}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{height:31px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-logo{background:#fff;padding:5px 10px;border-radius:10px;height:41px}}
:root[data-theme="dark"] .brand-logo{background:#fff;padding:5px 10px;border-radius:10px;height:41px}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.mark{width:32px;height:32px;border-radius:10px;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600;white-space:nowrap;color:var(--ink);cursor:pointer}
.pill svg{width:16px;height:16px}
.pill.streak svg{color:var(--gold)}
.pill.safe{color:var(--green)}
.pill .lbl{display:none}
@media (min-width:560px){.pill .lbl{display:inline}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{appearance:none;border:0;background:none;color:var(--ink-3);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;border-radius:12px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--green);background:var(--green-soft)}
@media (min-width:980px){
  .tabs{position:static;display:flex;padding:4px;border:1px solid var(--line);border-radius:14px;width:max-content;max-width:100%}
  .tab{flex-direction:row;font-size:.9rem;padding:0 16px;min-height:40px;gap:8px}
  .tab svg{width:18px;height:18px}
  .tab[data-mobile]{display:none}
}
.foot{font-size:.78rem;color:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.head p{margin-top:3px}
.muted{color:var(--ink-2)}
.small{font-size:.87rem}
.tiny{font-size:.78rem;color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{appearance:none;border:1px solid transparent;font-weight:700;font-size:.92rem;min-height:44px;padding:0 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:var(--green-ink);text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.q{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.q:hover{background:var(--surface-2);filter:none}
.btn.sm{min-height:38px;padding:0 13px;font-size:.84rem;border-radius:10px}
.btn.danger{background:var(--coral);color:var(--coral-ink)}
.btn.link{background:none;border:0;color:var(--green);padding:0 4px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.bad{background:var(--coral-soft);color:var(--coral)}
.chip.good{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--gold-soft);color:var(--gold-ink)}
.chip.info{background:var(--blue-soft);color:var(--blue)}

.banner{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.banner p{max-width:60ch}

/* hero: money story */
.hero{padding:22px;display:grid;gap:20px}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
@media (min-width:620px){.hero-main{grid-template-columns:150px minmax(0,1fr);gap:26px}}
.ring{width:150px;height:150px;position:relative;margin-inline:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font-family:var(--f-display);font-size:2.9rem;font-weight:800;line-height:1}
.ring .val span{font-size:.74rem;color:var(--ink-2);margin-top:4px}
.arch{display:flex;gap:12px;align-items:center}
.emblem{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);flex:none}
.emblem svg{width:26px;height:26px}
.arch h2{font-size:clamp(1.55rem,3.6vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.evidence{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;max-width:66ch}
.evidence li{padding-left:18px;position:relative;color:var(--ink-2);font-size:.93rem}
.evidence li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.per100 h3{margin-bottom:10px}
.split{display:flex;height:26px;border-radius:9px;overflow:hidden;background:var(--surface-2);gap:2px}
.split i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:.86rem}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(.92rem,3.9vw,1.4rem);font-weight:700;white-space:nowrap}
@media (max-width:420px){.stat{padding:10px 8px}}
.stat span{font-size:.78rem;color:var(--ink-2)}
.gap{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--ink);font-size:.92rem}

/* coach feed */
.nudge{display:grid;grid-template-columns:4px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.nudge:first-of-type{border-top:0;padding-top:4px}
.nudge .stripe{border-radius:4px;background:var(--blue)}
.nudge.bad .stripe{background:var(--coral)}
.nudge.good .stripe{background:var(--green)}
.nudge h3{font-size:1rem}
.nudge p{color:var(--ink-2);font-size:.92rem;margin-top:3px;max-width:68ch}
.nudge .row{margin-top:10px}

/* bars */
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:.92rem;align-items:baseline}
.bar-row .track{grid-column:1/-1;height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.bar-row small{color:var(--ink-3);font-size:.78rem;margin-left:6px}

.cyc{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px;align-items:end;height:96px;margin-top:6px}
.cyc i{display:block;border-radius:2px 2px 0 0;background:var(--ink-3);opacity:.35;min-height:3px}
.cyc i.f{background:var(--gold);opacity:1}
.axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-3);margin-top:6px}
.big{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.1}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.tile .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .lab{font-size:.84rem;color:var(--ink-2);font-weight:600}
.tile b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile p{font-size:.86rem;color:var(--ink-2)}

.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .sub{font-size:.8rem;color:var(--ink-3)}
.li .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;height:auto;min-width:300px}

/* check-in */
.checkin{display:grid;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.done-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* statements panel */
.panel{display:grid;gap:14px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;display:grid;gap:4px;justify-items:center;cursor:pointer;background:var(--surface);transition:border-color .15s,background-color .15s}
.drop:hover,.drop.over{border-color:var(--green);background:var(--green-soft)}
.drop svg{width:30px;height:30px;color:var(--green);margin-bottom:4px}
.drop strong{font-size:1rem}
.lockline{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;color:var(--ink-2)}
.lockline svg{width:16px;height:16px;flex:none;color:var(--green);margin-top:2px}
.status{border-radius:12px;padding:12px 14px;font-size:.9rem}
.status.ok{background:var(--green-soft)}
.status.err{background:var(--coral-soft)}
.status.busy{background:var(--surface-2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.stmt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.stmt .nm{font-weight:600;font-size:.92rem;overflow-wrap:anywhere}

input[type=text],input[type=number],input[type=password],input[type=search],input[type=tel],input[type=email],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:9px 12px;width:100%;max-width:100%}
textarea{min-height:110px;resize:vertical;font-size:.9rem}
select{min-height:38px;padding:4px 8px;font-size:.84rem;border-radius:10px}
label.f{display:grid;gap:5px;font-size:.86rem;font-weight:600;color:var(--ink-2)}

.toggle{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.toggle:first-child{border-top:0}
.toggle b{display:block;font-size:.95rem}
.toggle span{font-size:.85rem;color:var(--ink-2)}
.switch{position:relative;width:46px;height:28px;flex:none;margin-top:2px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;pointer-events:none;border-radius:28px;background:var(--line);transition:background-color .15s}
.switch i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + i{background:var(--green)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--blue);outline-offset:2px}
.switch input:disabled + i{opacity:.5}

/* grow */
.ch{display:grid;gap:10px}
.ch .row.top{justify-content:space-between;align-items:flex-start}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.dots i.on{background:var(--green)}
.dots i.now{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--green)}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;min-height:36px;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.verify{font-size:.86rem;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.lesson-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lesson-row:first-child{border-top:0}
.lesson-row .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.lesson-row.done .ico{background:var(--green-soft);color:var(--green)}
.lesson-row .ico svg{width:18px;height:18px}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}

/* me */
.xp{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold);border-radius:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:320px}
.cal i{aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:block}
.cal i.calm{background:var(--green)}
.cal i.okay{background:var(--blue)}
.cal i.tense{background:var(--coral)}
.cal i.today{box-shadow:0 0 0 2px var(--ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px}
.badge{text-align:center;font-size:.78rem;color:var(--ink-3)}
.hex{width:56px;height:62px;margin:0 auto 6px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;background:var(--surface-2);color:var(--ink-2)}
.badge.on{color:var(--ink)}
.badge.on .hex{background:var(--gold);color:var(--surface)}

/* coach */
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.55;font-size:.95rem;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--green);color:var(--green-ink);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.a.err{background:var(--coral-soft)}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-size:.86rem;font-weight:600;cursor:pointer;text-align:left}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.composer textarea{min-height:48px;height:48px}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.9rem}

/* sheet, toasts, celebration */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);display:grid;gap:14px;align-content:start}
.sheet.wide{max-width:780px}
.sheet .x{justify-self:end;margin:-6px -6px 0 0}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:22px}}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:48px;font-weight:600;cursor:pointer;width:100%}
.opt:hover{border-color:var(--green)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.progress{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}
.lesson p{max-width:64ch;line-height:1.6;margin-top:10px}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.tx .d{font-size:.76rem;color:var(--ink-3)}
.tx .ds{font-size:.9rem;overflow-wrap:anywhere}
.tx .amt{font-weight:700;text-align:right}
.tx .amt.in{color:var(--green)}
.tx select{grid-column:1/-1}
@media (min-width:640px){.tx{grid-template-columns:minmax(0,1fr) 190px 110px}.tx select{grid-column:auto}}

/* ================= state & storage ================= */
const KEY='ledger_v3';
function freshState(){return{v:3,cur:'NGN',demo:true,consent:{read:false,store:false,ai:false,at:null},statements:[],txns:[],quiz:null,xp:0,badges:[],checkins:{},challenges:{active:[],done:[],ended:[]},lessons:{},tags:0,tagXP:{d:'',n:0},scoreHist:{},coachDays:{},tab:'home'};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===3){const o=Object.assign(freshState(),s);o.txns.forEach(t=>{if(!t.cur)t.cur='NGN';});o.statements.forEach(t=>{if(!t.cur)t.cur='NGN';});if(!CUR_MAP[o.cur])o.cur='NGN';return o;}}catch(e){}return freshState();}

/* ================= Ledger Plus: free trial and subscription ================= */
const PLAN=Object.assign({trialDays:7,priceNaira:9000,monthlyUploads:20,warnAt:0.8,bank:'UBA',accountName:'JONSPIRE LIMITED',accountNumber:'1029821937',remindDays:3,appUrl:'',cardUrl:'https://whop.com/checkout/plan_K5cA8QWGAioHD/',cardPriceUsd:9},window.LEDGER_PLAN||{});
const PKEY='ledger_plan';
function loadPlan(){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&typeof p==='object')return p;}catch(e){}return{};}
let P=loadPlan();
function savePlan(){try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){}}
// The free trial lasts PLAN.trialDays from the first statement upload. Its start time is also kept in a small cookie,
// so clearing only part of the browser data doesn't hand out a fresh trial.
const TRIAL_COOKIE='ledger_trial';
function readTrialCookie(){try{const m=document.cookie.match(/(?:^|; )ledger_trial=(\d{10,14})/);return m?+m[1]:0;}catch(e){return 0;}}
function writeTrialCookie(n){try{document.cookie=`${TRIAL_COOKIE}=${n}; max-age=63072000; path=/; SameSite=Strict${location.protocol==='https:'?'; Secure':''}`;}catch(e){}}
if(typeof P.used!=='number')P.used=S.demo?0:S.statements.length;

const planActive=()=>!!(P.sub&&P.sub.end&&Date.parse(P.sub.end)>Date.now());

async function subApi(action,body){
  const r=await fetch('/api/sub/'+action,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  let d={};try{d=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(d.error||'Something went wrong. Try again.');e.status=r.status;e.data=d;throw e;}
  return d;
}
function takeSub(d){
  const prev=P.sub;
  P.sub={id:d.id,name:d.name,status:d.status,end:d.end,cancelAtEnd:!!d.cancelAtEnd,pending:!!d.pending,rejectedReason:d.rejectedReason||'',usage:d.usage||null,checkedAt:Date.now()};

  else if(prev&&prev.end&&d.end&&d.end>prev.end&&prev.status==='active')toast('Renewal verified. Ledger Plus now runs until '+fmtLong(d.end));
}
async function refreshPlan(){
  if(IN_VIEWER||!P.id||!P.token)return;

// Counts one upload. Free uploads are counted on this device; paid uploads are counted by our server (the record that counts),
// and the app keeps its own tally in step so the meter is right even offline.
function countUpload(){
  if(planActive()){
    P.pendingUse=(P.pendingUse||0)+1;savePlan();
    if(!IN_VIEWER&&P.id&&P.token)flushUse().finally(()=>{usageNudge();render();});
    else usageNudge();
    return;
  }
  const firstUse=!P.trialStart;
  if(firstUse){P.trialStart=Date.now();if(!IN_VIEWER)writeTrialCookie(P.trialStart);}
  P.used=(P.used||0)+1;savePlan();
  if(trialOver())setTimeout(()=>openPlan('limit'),900);
  else toast(firstUse?`Your ${PLAN.trialDays}-day free trial has started`:`Free trial: ${trialDaysLeft()} day${trialDaysLeft()===1?'':'s'} left`);
}
// Reports uploads to the server one at a time. Uploads made offline wait here and are sent as soon as the phone is online again.
let flushing=null;
function flushUse(){
  if(flushing)return flushing;
  flushing=(async()=>{
    while((P.pendingUse||0)>0){
      try{const d=await subApi('use',{id:P.id,token:P.token});P.pendingUse=Math.max(0,(P.pendingUse||0)-1);takeSub(d);}
      catch(e){
        if(e&&e.status===402){P.pendingUse=0;if(e.data)takeSub(e.data);savePlan();}   // the month is full on the server: the server's count wins
        else if(e&&e.status===401){P.pendingUse=0;savePlan();}
        break;                                                                        // offline or server trouble: keep the rest queued
      }
    }
    savePlan();
  })().finally(()=>{flushing=null;});
  return flushing;
}
if(!IN_VIEWER)addEventListener('online',()=>{if(P.id&&P.token&&(P.pendingUse||0)>0)flushUse().then(()=>render());});
// At 80% and at 100% of the month's allowance, ask the person to renew or cancel.
function usageNudge(){
  if(!planActive())return;
  const used=monthUsed(),key=P.sub.end+'|'+(monthFull()?'full':monthWarn()?'warn':'');
  if(!monthFull()&&!monthWarn())return;
  if(P.nudged===key)return;P.nudged=key;savePlan();
  if(monthFull())toast(`That was upload ${used} of ${monthLimit()}. Renew to keep uploading.`);
  else toast(`${used} of ${monthLimit()} uploads used this month. ${monthLeft()} left.`);
  setTimeout(()=>{closeSheet();openPlan(monthFull()?'full':'warn');},1100);
  usageNotify();
}

function openPlan(reason){if(reason!==undefined){planErr='';cancelAsk=false;planView=null;}const keep=$('#planSheet')?$('#planSheet').dataset.reason:'';reason=reason||keep||'';openSheet(planHTML(reason));const el=$('#planSheet');if(el)el.dataset.reason=reason;}
const notifyOk=()=>!IN_VIEWER&&'Notification' in window&&'serviceWorker' in navigator;
function notifyOffer(){if(!notifyOk()||Notification.permission!=='default')return'';return`<p class="small"><button class="btn q sm" data-act="plan-notify">Remind me on this phone</button> <span class="tiny">A notification ${PLAN.remindDays} days before your month ends.</span></p>`;}
async function maybeNotify(){
  if(!notifyOk()||Notification.permission!=='granted'||!renewDue())return;
  const t=todayISO();if(P.notified===t)return;P.notified=t;savePlan();
  const dl=planDaysLeft();
  try{const reg=await navigator.serviceWorker.ready;reg.showNotification(`Ledger Plus ends in ${dl} day${dl===1?'':'s'}`,{body:`Renew for ${priceTxt()} or cancel before ${fmtLong(P.sub.end)}.`,icon:'icons/icon-192.png',badge:'icons/favicon-32.png',tag:'ledger-renew'});}catch(e){}
}
async function fileToProof(f){
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    if(f.size>3.5*1024*1024)throw new Error('That PDF is over 3.5 MB. Take a screenshot of the receipt instead.');
    return{type:'application/pdf',data:await b64(f)};
  }
  if(!/^image\//.test(f.type))throw new Error('Upload a screenshot, photo or PDF of your receipt.');
  try{
    const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.86));
    if(blob)return{type:'image/jpeg',data:await b64(blob)};
  }catch(e){}
  if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw new Error("That image type can't be read here. Take a screenshot (PNG or JPG) instead.");
  if(f.size>3.5*1024*1024)throw new Error('That image is over 3.5 MB. Take a screenshot instead.');
  return{type:f.type,data:await b64(f)};
}
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('read'));r.readAsDataURL(blob);});}
async function planRun(label,fn){planBusy=label;planErr='';openPlan();try{await fn();}catch(e){planErr=e.message||'Something went wrong. Try again.';if(e.status===401){planErr='This phone is no longer linked to your subscription. Use Restore with your code and phone number.';}}finally{planBusy=false;if($('#planSheet'))openPlan();render();}}

function usageMeter(){
  const u=monthUsed(),L=monthLimit(),cls=monthFull()?'bad':monthWarn()?'warn':'info';
  return`<div class="usage"><div class="head"><p class="small"><b>${u} of ${L}</b> statement uploads used this month</p><span class="chip ${cls}">${monthFull()?'All used':monthLeft()+' left'}</span></div><div class="xp ${cls}" role="progressbar" aria-label="Uploads used this month" aria-valuemin="0" aria-valuemax="${L}" aria-valuenow="${u}"><i style="width:${u/L*100}%"></i></div></div>`;
}
function planLine(){
  if(planActive())return`<div class="planline good">${ic('check')}<span><b>Ledger Plus</b> · ${monthUsed()} of ${monthLimit()} uploads used · until ${fmtLong(P.sub.end)}</span></div>`;
  if(P.sub&&P.sub.pending)return`<div class="planline">${ic('check')}<span>Payment received, being verified. <button class="btn link" data-act="plan">Details</button></span></div>`;
  const left=freeLeft();
  if(left>0)return`<div class="planline">${ic('star')}<span>${trialStarted()?`Free trial: <b>${left} of ${PLAN.trialDays} days</b> left`:`<b>${PLAN.trialDays}-day free trial</b> starts with your first statement`}</span></div>`;
  return`<div class="planline warn">${ic('lock')}<span>Free trial ended. <button class="btn link" data-act="plan">Get Ledger Plus · ${priceTxt()}/month</button></span></div>`;
}

  if(monthFull())return`<div class="banner" role="alert"><p><b>You've used all ${monthLimit()} uploads for this month.</b> Renew for ${priceTxt()} to keep uploading, or cancel. Your data stays here.</p><div class="row"><button class="btn sm" data-act="plan-renew">Renew</button><button class="btn q sm" data-act="plan-cancel-open">Cancel</button></div></div>`;

  catch(e){try{return new TextDecoder('windows-1252').decode(buf);}catch(e2){return new TextDecoder().decode(buf);}}

/* ---------- statements panel ---------- */
function statusHTML(){
  if(U.busy)return`<div id="uploadStatus" class="status busy" role="status"><span class="spin" aria-hidden="true"></span>${esc(U.msg||'Reading…')}</div>`;
  if(U.needPassword)return`<div id="uploadStatus" class="status busy"><form class="stack" data-form="pw" style="gap:10px"><p class="small"><b>This PDF is password-protected.</b> ${U.wrong?'That password did not work. ':''}Many banks use your account number, date of birth or a code from the email.</p><label class="f" for="pwIn">PDF password<input type="password" id="pwIn" autocomplete="off"></label><div class="row"><button class="btn sm" type="submit">Unlock and read</button><button class="btn q sm" type="button" data-act="pw-cancel">Cancel</button></div><p class="tiny">Used once to open the file. Never saved.</p></form></div>`;
  if(U.error)return`<div id="uploadStatus" class="status err" role="alert">${esc(U.error)}</div>`;
  if(U.ok)return`<div id="uploadStatus" class="status ok" role="status">${esc(U.ok)}</div>`;
  return'<div id="uploadStatus" hidden></div>';
}
function statementsPanel(){
  const A=getA();const T=getTxns();
  const list=S.demo?`<div class="stmt"><div><div class="nm">Sample statement (Tolu, fictional)</div><div class="tiny">${A?`${fmtD(A.from)} – ${fmtDY(A.to)} · ${T.length} transactions`:''}</div></div><button class="btn q sm" data-act="clear-demo">Remove</button></div>`
    :S.statements.map(s=>`<div class="stmt"><div><div class="nm">${esc(s.name)}</div><div class="tiny">${s.from?fmtD(s.from)+' – '+fmtDY(s.to)+' · ':''}${s.count} transactions · ${esc(s.cur||'NGN')}</div>${s.kind==='manual'?'':`<label class="tiny">Currency <select aria-label="Currency of ${esc(s.name)}" data-change="stmt-cur" data-arg="${s.id}">${curOptions(s.cur||'NGN')}</select></label>`}</div><button class="btn q sm" data-act="rm-stmt" data-arg="${s.id}" aria-label="Remove ${esc(s.name)}">Remove</button></div>`).join('');
  const curs=[...new Set(S.txns.map(t=>t.cur||'NGN'))];
  const chips=!S.demo&&curs.length>1?`<div><h3 style="margin-bottom:4px">Show amounts in</h3><div class="row" role="group" aria-label="Currency to show">${curs.map(c=>`<button class="btn ${c===S.cur?'':'q'} sm" data-act="set-cur" data-arg="${c}" aria-pressed="${c===S.cur}">${c} ${curSym(c)}</button>`).join('')}</div><p class="tiny">Ledger never converts between currencies. Each currency is analysed on its own.</p></div>`:'';
  return`<div class="panel">
   <div><h2>Statements</h2><p class="muted small" style="margin-top:4px">Upload the statement you already get from your bank. No bank login and no account linking.</p></div>
   <div class="drop" data-act="pick" role="button" tabindex="0" aria-label="Upload a bank statement">${ic('upload')}<strong>Drop a statement here</strong><span class="muted small">or tap to choose a file</span><span class="tiny">PDF, Excel, CSV, OFX or QIF from banks in Africa, Europe, the US and beyond</span></div>
   ${statusHTML()}
   ${planLine()}
   <div class="lockline">${ic('lock')}<span>Read on this device. The file is never uploaded or stored, only the transactions it contains.</span></div>
   <div class="row"><button class="btn q sm" data-act="paste">${pasteOpen?'Hide paste box':'Paste text instead'}</button><button class="btn q sm" data-act="manual">Enter numbers by hand</button></div>
   ${pasteOpen?`<div class="stack" style="gap:8px"><label class="f" for="pasteBox">Paste rows from your statement<textarea id="pasteBox" data-input="paste" placeholder="01/09/2026  POS PURCHASE SHOPRITE  18,500.00  142,300.00">${esc(pasteDraft)}</textarea></label><button class="btn sm" data-act="paste-go">Read pasted rows</button></div>`:''}
   ${chips}
   ${list?`<div><h3 style="margin-bottom:4px">On this device</h3>${list}</div>`:''}
   ${T.length?`<button class="btn q" data-act="txns" data-arg="${A&&A.untagged?'untagged':'all'}">Review transactions${A&&A.untagged?` · ${A.untagged} need a tag`:''}</button>`:''}
   <details><summary>Where do I get my statement?</summary><p class="small muted">In most bank apps, look for "Account statement" under Accounts, Cards or Help. Choose the last 3 months as PDF or Excel. Many banks also email statements on request.</p></details>
  </div>`;
}

/* ---------- home ---------- */
function viewHome(){
  const A=getA();let h=planBanner();
  if(S.demo)h+=`<div class="banner"><p><b>You're looking at a sample.</b> Tolu is a fictional professional (shown in naira). Upload your own statement to see your real money story.</p><div class="row"><button class="btn sm" data-act="pick">${ic('upload')}Upload my statement</button></div></div>`;
  h+=checkinCard();
  if(!A)return h+emptyHero();
  h+=`<div id="story" class="stack">${storyHero(A)}${coachFeed(A)}<div class="grid2">${whereCard(A)}${cycleCard(A)}</div>${insightTiles(A)}<div class="grid2">${merchantsCard(A)}${trendCard(A)}</div></div>`;
  if(!S.quiz)h+=`<section class="card row" style="justify-content:space-between"><div><h3>Tell your coach about you</h3><p class="muted small">Five quick questions. Your coach compares what you say with what your statement shows.</p></div><button class="btn" data-act="quiz">Take the quiz · +50 XP</button></section>`;
  return`<div class="stack">${h}</div>`;
}
function emptyHero(){
  return`<section class="card hero"><div><h2 style="font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800">See where your money really goes</h2><p class="muted" style="margin-top:8px;max-width:58ch">Upload a bank statement you already have. Ledger reads it on this device, finds your patterns and coaches you from there. No bank login needed.</p></div>
  <div class="row"><button class="btn" data-act="pick">${ic('upload')}Upload a statement</button><button class="btn q" data-act="load-demo">Try the sample</button><button class="btn q" data-act="manual">Enter numbers by hand</button></div>
  <div class="lockline">${ic('lock')}<span>PDF, Excel, CSV or pasted text. Password-protected PDFs work too.</span></div></section>`;
}
function checkinCard(){
  const t=todayISO(),c=S.checkins[t];
  if(c)return`<section class="card done-line"><span class="chip good">${ic('check')} Checked in</span><span class="muted small">Day ${streak()} of your streak. Money felt ${c.mood==='calm'?'calm':c.mood==='okay'?'okay':'tense'} today${c.spend==='lot'?'. Big unplanned spends happen; tomorrow, set a limit before you leave home.':'.'}</span></section>`;
  const b=(k,v,l)=>`<button type="button" data-act="ci" data-arg="${k}:${v}" aria-pressed="${ciDraft[k]===v}">${l}</button>`;
  return`<section class="card checkin" aria-label="Daily check-in"><div class="head" style="margin:0"><div><h3>Daily check-in</h3><p class="muted small">Ten seconds. Keeps your streak and your coach honest.</p></div><span class="chip warn">+10 XP</span></div>
   <div><p class="small" style="font-weight:600;margin-bottom:6px">How does money feel today?</p><div class="seg">${b('mood','calm','Calm')}${b('mood','okay','Okay')}${b('mood','tense','Tense')}</div></div>
   <div><p class="small" style="font-weight:600;margin-bottom:6px">Any unplanned spending today?</p><div class="seg">${b('spend','none','None')}${b('spend','little','A little')}${b('spend','lot','A lot')}</div></div></section>`;
}
function ringSVG(score){const r=52,c=2*Math.PI*r,col=score>=70?'var(--green)':score>=45?'var(--gold)':'var(--coral)';return`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}"/></svg>`;}
const GCOL={need:'var(--blue)',want:'var(--gold)',leak:'var(--coral)',other:'var(--ink-3)',save:'var(--green)'};
function storyHero(A){
  const who=S.demo?"Tolu's money story (sample)":'Your money story';
  const kept=Math.max(0,A.keptPer100),over=A.keptPer100<0;
  const segs=A.per100.map(p=>({...p,c:GCOL[p.k]})).concat(over?[]:[{k:'save',label:'Kept',v:kept,c:GCOL.save}]);
  const scale=Math.max(100,A.per100.reduce((s,p)=>s+p.v,0));
  const quizGap=quizContrast(A);
  return`<section class="card hero" aria-label="${esc(who)}">
   <div class="head" style="margin:0"><div><p class="small" style="font-weight:700;color:var(--green)">${esc(who)}</p><p class="tiny">${fmtD(A.from)} – ${fmtDY(A.to)} · ${A.count} transactions</p></div><span class="chip">Habit score, not a credit score</span></div>
   <div class="hero-main">
    <div class="ring" role="img" aria-label="Habit score ${A.score.total} out of 100">${ringSVG(A.score.total)}<div class="val"><b data-count="${A.score.total}">${A.score.total}</b><span>of 100</span></div></div>
    <div><div class="arch"><span class="emblem">${ic(A.arch.icon)}</span><h2>${esc(A.arch.name)}</h2></div>
     <p style="margin-top:8px;max-width:62ch">${esc(A.arch.line)}</p>
     ${A.traits.length?`<ul class="evidence">${A.traits.slice(0,3).map(t=>`<li>${esc(t.ev)}</li>`).join('')}</ul>`:''}
     ${A.traits.length>1?`<div class="traits">${A.traits.slice(1,5).map(t=>`<span class="chip">${esc(ARCH[t.id].chip)}</span>`).join('')}</div>`:''}
    </div></div>
   <div class="stats3"><div class="stat"><b data-count="${Math.round(A.m.income)}" data-fmt="n">${money(A.m.income)}</b><span>in per month</span></div><div class="stat"><b data-count="${Math.round(A.m.spend)}" data-fmt="n">${money(A.m.spend)}</b><span>out per month</span></div><div class="stat"><b style="color:${A.keptRate<0?'var(--coral)':'var(--green)'}">${A.keptRate<0?'-':''}${pct(Math.abs(A.keptRate))}</b><span>${A.keptRate<0?'overspent':'kept'}</span></div></div>
   <div class="per100"><h3>Of every ${curSym()}100 ${S.demo?'Tolu earns':'you earn'}</h3>
    <div class="split" role="img" aria-label="${segs.map(s=>`${s.label} ${curSym()}${Math.round(s.v)}`).join(', ')}">${segs.map(s=>`<i style="width:${s.v/scale*100}%;background:${s.c}"></i>`).join('')}</div>
    <div class="legend">${segs.map(s=>`<span><i style="background:${s.c}"></i>${s.label} <b class="num">${curSym()}${Math.round(s.v)}</b></span>`).join('')}${over?`<span style="color:var(--coral)"><b>${curSym()}${Math.round(-A.keptPer100)} more than earned</b></span>`:''}</div></div>
   ${quizGap?`<p class="gap">${esc(quizGap)}</p>`:''}
  </section>`;
}
function quizContrast(A){
  if(!S.quiz)return'';const q=S.quiz;
  if(q.saver>=3&&A.keptRate<0.1)return`You told your coach you usually save first. This statement shows ${A.keptRate<0?'more going out than coming in':`you kept ${pct(A.keptRate)}`}. That gap is common, and it usually closes when savings move on payday, before spending starts.`;
  if(q.anxious>=3&&A.keptRate>=0.1)return`You said money makes you anxious, but your numbers are steadier than that feeling: you kept ${pct(A.keptRate)}. Checking in often tends to shrink the anxiety.`;
  if(q.spender>=3&&A.traits.some(t=>t.id==='sprinter'||t.id==='weekend'))return'You said you like to enjoy money when it arrives, and your statement agrees. The aim is not to stop, but to decide the amount before payday does.';
  if(q.goal)return`Your goal is ${GOALS[q.goal]}. Every nudge below is ranked with that in mind.`;
  return'';
}
function coachFeed(A){
  const N=nudges(A),show=N.slice(0,3);
  return`<section class="card" aria-label="Coach feed"><div class="head"><div><h2>Your coach says</h2><p class="muted small">Ranked by what would help most right now.</p></div><button class="btn q sm" data-act="tab" data-arg="coach">${ic('chat')}Ask a question</button></div>
   ${show.map(n=>`<div class="nudge ${n.tone}"><span class="stripe" aria-hidden="true"></span><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="row">${n.acts.map(([l,a,g],i)=>`<button class="btn ${i?'q ':''}sm" data-act="${a}" data-arg="${g}">${esc(l)}</button>`).join('')}</div></div></div>`).join('')}
   ${N.length>3?`<details><summary>${N.length-3} more</summary>${N.slice(3).map(n=>`<div class="nudge ${n.tone}"><span class="stripe" aria-hidden="true"></span><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="row">${n.acts.map(([l,a,g],i)=>`<button class="btn ${i?'q ':''}sm" data-act="${a}" data-arg="${g}">${esc(l)}</button>`).join('')}</div></div></div>`).join('')}</details>`:''}
  </section>`;
}
function groupOf(c){if(c.cat==='Betting'||c.cat==='Subscriptions'||c.type==='fee')return'leak';return{need:'need',want:'want'}[c.type]||'other';}
function whereCard(A){
  const top=A.cats.slice(0,9),max=Math.max(...top.map(c=>c.m),1);
  return`<section class="card"><div class="head"><div><h2>Where it goes</h2><p class="muted small">Average per month</p></div></div>
  <div class="bars">${top.map(c=>`<div class="bar-row"><span>${esc(c.cat)}<small>${pct(c.m/Math.max(1,A.m.income))} of income</small></span><b>${money(c.m)}</b><div class="track"><i style="width:${c.m/max*100}%;background:${GCOL[groupOf(c)]}"></i></div></div>`).join('')}</div>
  <div class="legend" style="margin-top:14px">${[['need','Essentials'],['want','Lifestyle'],['leak','Leaks'],['other','Transfers, cash & loans']].map(([k,l])=>`<span><i style="background:${GCOL[k]}"></i>${l}</span>`).join('')}</div></section>`;
}
function cycleCard(A){
  if(!A.cycleBars)return`<section class="card"><h2>Your pay cycle</h2><p class="muted small" style="margin-top:6px">Upload a statement covering at least one full month after a payday to see when in the month you spend.</p></section>`;
  const max=Math.max(...A.cycleBars,1);
  return`<section class="card"><div class="head"><div><h2>Your pay cycle</h2><p class="muted small">Lifestyle spending by day after payday</p></div></div>
  <p><span class="big">${pct(A.front)}</span> <span class="muted">in the first 7 days</span></p>
  <div class="cyc" role="img" aria-label="${pct(A.front)} of lifestyle spending happens in the first 7 days after payday">${A.cycleBars.map((b,i)=>`<i class="${i<7?'f':''}" style="height:${Math.max(3,b/max*100)}%"></i>`).join('')}</div>
  <div class="axis"><span>Payday</span><span>Day 7</span><span>Day 30</span></div>
  <p class="small muted" style="margin-top:10px">All spending in those 7 days averages ${money(A.spent7)}, including rent and transfers.</p></section>`;
}
function insightTiles(A){
  const m=A.m,T=[];
  if(A.weekendShare!=null)T.push(['Weekend share',pct(A.weekendShare),'of lifestyle spending on Friday to Sunday. Three days out of seven is 43%.',A.weekendShare>0.58?'warn':'good',A.weekendShare>0.58?'High':'Even']);
  T.push(['Small spends',money(m.tiny),`a month across about ${Math.round(A.tinyN/A.months)} purchases under ${money(localScale(2000))}.`,m.tiny>0.05*m.income?'warn':'good',m.tiny>0.05*m.income?'Adds up':'Fine']);
  if(m.fees>0)T.push(['Bank fees & levies',money(m.fees),`a month. Alerts ${money(A.feeParts.sms/A.months)}, transfer charges ${money(A.feeParts.transfer/A.months)}, levies ${money(A.feeParts.levy/A.months)}.`,m.fees>1500?'bad':'warn','Leak']);
  if(m.betOut>0)T.push(['Betting, net',money(Math.max(0,m.betNet)),`a month lost after wins. Staked ${money(m.betOut)}, won back ${money(m.betIn)}.`,'bad','Leak']);
  if(A.subs.length)T.push(['Subscriptions',money(A.subsM),`a month: ${A.subs.slice(0,3).map(s=>s.name).join(', ')}.`,'warn','Review']);
  if(m.transfer+m.giving>0)T.push(['To other people',money(m.transfer+m.giving),`a month in transfers and giving.${A.untagged?` ${A.untagged} still need a tag.`:''}`,'info','Tag']);
  if(m.cash>0)T.push(['Cash withdrawals',money(m.cash),"a month. Your coach can't see where cash goes.",m.cash>0.1*m.income?'warn':'info','Blind spot']);
  if(m.saving>0)T.push(['Moved to savings',money(m.saving),'a month, net of withdrawals.','good','Good']);
  if(A.biggest)T.push(['Biggest single spend',money(A.biggest.a),`${A.biggest.t.cat} on ${fmtD(A.biggest.t.date)}.`,'info','Info']);
  return`<section aria-label="Behaviour insights"><h2 style="margin:4px 0 12px">Your patterns</h2><div class="tiles">${T.map(([l,v,p,tone,chip])=>`<div class="tile"><div class="top"><span class="lab">${l}</span><span class="chip ${tone}">${chip}</span></div><b>${v}</b><p>${esc(p)}</p></div>`).join('')}</div></section>`;

function merchantsCard(A){

async function serverCoach(summary,messages,signal){
  let res;
  try{res=await fetch(COACH_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({summary,messages}),signal});}
  catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:navigator.onLine===false?'offline':'upstream_error'};}
  let data={};try{data=await res.json();}catch(e){}
  if(res.ok&&data.text)return data.text;
  throw{code:res.status===429?'rate_limited':res.status===503||res.status===404?'not_granted':res.status===400?'refused':'upstream_error'};
}
async function ask(q){

  chatCtl=new AbortController();

  try{
    const text=IN_VIEWER
      ?(await sampleFn([{role:'user',content:coachRules(A)},...turns],{cache:false,signal:chatCtl.signal,onText:({text})=>{liveText=text;const el=$('#live');if(el)el.textContent=text;}})).text

    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){sampleState='none';chat.push({role:'assistant',content:"Your coach can't answer in this view. The coach feed on Home still works.",err:true});}
    else chat.push({role:'assistant',content:code==='rate_limited'?'You have asked a lot of questions in a short time. Try again in a little while.':code==='offline'?"You're offline. Your coach needs internet to answer; everything else in Ledger works offline.":code==='session_expired'?'Sign in to Claude again to keep chatting.':code==='refused'?"I can't help with that one. Try asking another way.":(e&&e.text?e.text+'\n\n(Interrupted. Try again.)':'Something went wrong on the way. Try again.'),err:true});
  }finally{chatBusy=false;liveText='';chatCtl=null;if(tab==='coach')render();}
}

async function ingestFile(f,password){

  try{
    const buf=await f.arrayBuffer();let rows,kind;
    if(ext==='pdf'||f.type==='application/pdf'){rows=await pdfToRows(buf,password);kind='pdf';}
    else if(ext==='xlsx'||ext==='xls'){rows=await xlsxToRows(buf);kind='xlsx';}
    else{
      const text=decodeText(buf);const st=parseStructured(text,S.cur||localeCurrency());
      if(st){finishIngest(null,'file',f.name,st);return;}
      rows=textToRows(text);kind='text';

  }catch(err){
    if(err&&err.name==='PasswordException'){pendingFile=f;setU({needPassword:true,wrong:err.code===2});const p=$('#pwIn');if(p)p.focus();return;}

}
function finishIngest(rows,kind,name,pre){

  if(!canUpload()){setU({});openPlan('limit');return;}
  const {txns,cur:scur}=pre||parseStatement(rows,kind,S.demo?(localeCurrency()||'NGN'):(S.cur||localeCurrency()));
  if(txns.length<3){setU({error:kind==='pdf'&&rows.length<8?'This PDF has no readable text. It may be a scanned image. Download the digital statement from your bank app, or use the Excel or CSV export.':'Ledger found fewer than 3 transactions. Check that this is a bank statement with dates and amounts.'});return;}

  const key=t=>t.date+'|'+t.amt.toFixed(2)+'|'+merchantKey(t.desc);

  pasteOpen=false;pasteDraft='';

}

  'plan-renew':()=>{openPlan('');planView='pay';openPlan();},
  'plan-cancel-open':()=>{openPlan('');planView='active';cancelAsk=true;openPlan();},
  'plan-view':v=>{planErr='';planView=v||null;openPlan();},
  'plan-restore-open':()=>{openPlan('');planView='restore';openPlan();},
  'plan-proof':()=>{const i=$('#proofIn');if(i)i.click();},
  'plan-refresh':()=>planRun('Checking…',async()=>{takeSub(await subApi('status',{id:P.id,token:P.token}));if(planActive()&&!P.sub.pending)planView=null;}),
  'plan-cancel-ask':()=>{cancelAsk=true;openPlan();},
  'plan-cancel-no':()=>{cancelAsk=false;openPlan();},
  'plan-cancel':()=>planRun('Saving…',async()=>{takeSub(await subApi('cancel',{id:P.id,token:P.token}));cancelAsk=false;toast('Renewal cancelled. You keep Ledger Plus until '+fmtLong(P.sub.end));}),
  'plan-resume':()=>planRun('Saving…',async()=>{takeSub(await subApi('resume',{id:P.id,token:P.token}));toast("You'll get a reminder before your month ends");}),
  'plan-notify':async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?`We'll remind you ${PLAN.remindDays} days before your month ends`:'Notifications are off. You will still see a reminder in the app.');}catch(e){}openPlan();maybeNotify();},
  copy:a=>{const done=()=>toast('Copied '+a);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(a).then(done,()=>toast(a));else toast(a);}
});
CHANGE['proof-file']=(a,el)=>{const f=el.files&&el.files[0];el.value='';if(!f)return;
  planRun('Uploading your receipt…',async()=>{const file=await fileToProof(f);takeSub(await subApi('proof',{id:P.id,token:P.token,file}));planView='pending';});};
ACT.forget=()=>{S.consent.store=false;save();$('#wipeBox').innerHTML='';render();toast('Ledger will forget your transactions when you close this page');};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el.dataset.arg,el,e);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const c=$('.celebrate');if(c){c.remove();return;}if($('#sheetRoot .scrim'))closeSheet();}
  const d=e.target.closest&&e.target.closest('.drop');if(d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ACT.pick();}
  if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(chatDraft);}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHANGE[el.dataset.change])CHANGE[el.dataset.change](el.dataset.arg,el);});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k==='paste')pasteDraft=e.target.value;if(k==='chat')chatDraft=e.target.value;});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==='pw'){const pw=$('#pwIn').value;if(pendingFile&&pw)ingestFile(pendingFile,pw);}
  if(f==='chat')ask(chatDraft);
  if(f==='manual')submitManual();
  if(f==='plan-start'){planDraft={name:$('#plName').value,phone:$('#plPhone').value,email:$('#plEmail').value};
    if(!$('#plAgree').checked){planErr='Please tick the box to agree to the terms and privacy policy.';openPlan();return;}
    planRun('Setting up…',async()=>{takeSub(await subApi('start',{...planDraft,agree:true}));planView='pay';});}
  if(f==='plan-restore'){const id=$('#rsId').value,phone=$('#rsPhone').value;
    planRun('Restoring…',async()=>{takeSub(await subApi('restore',{id,phone}));planView=null;toast(planActive()?'Ledger Plus restored on this phone':'Subscription linked to this phone');});}
});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)ingestFile(f);});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();const d=e.target.closest&&e.target.closest('.drop');document.querySelectorAll('.drop.over').forEach(x=>x!==d&&x.classList.remove('over'));if(d)d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over');});
document.addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'));const d=e.target.closest&&e.target.closest('.drop');if(!d)return;const f=e.dataTransfer.files[0];gateUpload(()=>{if(!S.consent.read)openConsent(()=>ingestFile(f));else ingestFile(f);});});
mq.addEventListener('change',()=>render());

/* ================= boot ================= */
expireChallenges();
if(!S.demo&&!S.txns.length&&S.statements.length){S.statements=[];}
render();
if(IN_VIEWER){(async()=>{try{sampleFn=await window.claude.use('sample');}catch(e){sampleFn=null;}sampleState=sampleFn?'ready':'none';if(tab==='coach')render();})();}
else{
  sampleState='ready';
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render();});
  window.addEventListener('appinstalled',()=>{installEvt=null;toast('Ledger is installed');render();});
  refreshPlan();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P.id&&(!P.sub||Date.now()-(P.sub.checkedAt||0)>(P.sub.pending?60e3:30*60e3)))refreshPlan();});
  setInterval(()=>{if(document.visibilityState==='visible'&&P.sub&&P.sub.pending)refreshPlan();},120e3);
}
</script>
